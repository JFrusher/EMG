[project]
name = "emgdemo"
version = "0.1.0"
description = "Live EMG signal-to-action demonstrator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ble = ["bleak>=0.22"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
emg-demo = "emgdemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emgdemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Soak tests run for minutes by design, so they are opt-in: `pytest -m soak`.
addopts = "-q -m 'not soak'"
markers = ["soak: long-running stability checks"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
