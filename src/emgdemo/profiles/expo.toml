# What runs at the stand.
#
# Replay by default: it needs no hardware, never fails to start, and loops all day.
# Swap [source] to serial or ble on the day, keeping everything else.

[source]
kind = "dataset"
dataset_dir = "EMGdataset/dataset/raw_signals"
side_a_channel = "HandClose"
side_b_channel = "HandOpen"
replay_loop = true
# If the chosen source will not set up on the day, still put something on screen
# rather than an error page in front of a queue.
fallback_synthetic = true

[server]
fullscreen = true

[settings]
# Eight seconds of trace is enough for someone to see a contraction begin and end
# while they are still standing there.
trace_seconds = 8.0

[settings.gripper]
# Turn this down if the hand slams shut faster than participants can follow.
force_gain = 12.0
